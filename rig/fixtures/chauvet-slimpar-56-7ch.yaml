# Chauvet SlimPAR 56, 7-channel mode. Used by P1-P5.
# Channel values: QLC+ fixture definition Chauvet-SlimPAR-56.qxf.
model: Chauvet SlimPAR 56
mode: 7-ch
type: rgb
channels:
  - red
  - green
  - blue
  - { fixed: color_macro, value: 0 }   # 0-15 = no function
